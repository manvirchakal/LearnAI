name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_VERSION: "0.5"

jobs:
  lint:
    name: Lint, type-check, architecture contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/learnai
      # learnai ships a py.typed marker (PEP 561) so mypy can resolve real
      # types for it here even though tests/ imports it as an installed
      # package rather than sibling source — without that marker this
      # silently no-ops (everything from learnai resolves to Any) instead
      # of catching anything.
      - run: uv run mypy tests
      - name: Architecture boundaries (routers -> services -> repositories -> db)
        run: uv run lint-imports

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]
    env:
      MONGODB_URI: mongodb://localhost:27017
      QDRANT_URL: http://localhost:6333
      REDIS_URL: redis://localhost:6379
      ANTHROPIC_API_KEY: test-key-not-real
      SESSION_SECRET: ci-only-secret-not-for-production-use-32chars
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --all-extras --dev
      # pyproject.toml's addopts defaults to `-m 'not live and not
      # integration'` so a bare local `pytest` stays fast and needs nothing
      # running. This job has real Mongo/Qdrant/Redis service containers
      # above, so re-include `integration` here; `live` (real Anthropic API
      # calls) stays deselected — no key to spend here.
      #
      # The coverage gate is [tool.coverage.report] fail_under in
      # pyproject.toml, which pytest-cov applies itself: below it, this step
      # exits non-zero. It lives in config rather than as a --cov-fail-under
      # flag here so a local `pytest --cov` enforces the same number.
      # Coverage upload to an external service is deliberately not wired up
      # — add one only once there's an account/token to point it at; the
      # terminal report below is enough to catch a regression meanwhile.
      - run: uv run pytest -v -m "not live" --cov --cov-report=term-missing

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.11
      # Audit the locked *runtime* closure, not the dev tools: an advisory
      # against ruff or pytest isn't something this service ships to anyone.
      # --all-extras covers ml/media/games, which the worker image installs.
      # Exported from uv.lock rather than audited in-place so the versions
      # checked are exactly the pinned ones the images build from.
      - name: Export the locked runtime dependencies
        run: uv export --format requirements-txt --all-extras --no-dev --no-hashes --no-emit-project -o requirements-audit.txt
      - name: pip-audit
        run: uvx pip-audit -r requirements-audit.txt

  client:
    name: Client build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # CI=true makes react-scripts non-interactive and turns build warnings
      # into errors. The suite is small on purpose — GameFrame.test.js is a
      # security regression test (the game iframe's sandbox attribute), and
      # that property is worth a job of its own.
      - run: npm test -- --watchAll=false
        env:
          CI: true
      - run: npm run build
        env:
          CI: true
      # Reported, not gated — unlike the Python audit above, which is a hard
      # gate because it covers the code holding user data. `npm audit fix`
      # (semver-compatible only) is already applied to the lockfile; every
      # advisory still standing traces to one of three roots that only a
      # major bump clears: react-scripts (the build toolchain — the Vite
      # migration is what retires it), react-pdf-highlighter (pdfjs-dist,
      # plus an install-time `canvas` -> node-pre-gyp -> tar chain), and
      # react-router-dom v7. None of them ship exploitable code to the
      # browser, and a permanently failing step is one nobody reads.
      - run: npm audit
        continue-on-error: true

  docker:
    name: Build images and smoke-test the compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          load: true
          tags: learnai-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          load: true
          tags: learnai-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Bring up the full stack
        env:
          ANTHROPIC_API_KEY: test-key-not-real
        run: docker compose up -d mongo qdrant redis api worker
      - name: Wait for /health/ready
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health/ready || true)
            if [ "$code" = "200" ]; then
              echo "ready after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::stack never became ready"
          docker compose logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
