server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    # The app uses BrowserRouter, so /study/<id> and /collections are real
    # URLs a user can reload or bookmark but not files on disk. Without this
    # fallback every route except / would 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so a stale copy can never shadow a new build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the one file whose name never changes; caching it is how
    # a deploy silently keeps serving the previous bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
