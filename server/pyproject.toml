[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learnai-server"
version = "2.0.0"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0",

    # AWS Bedrock (Claude LLM — only remaining AWS dependency)
    "boto3>=1.35",
    "langchain-aws>=1.0",

    # LangGraph agents
    "langgraph>=1.0",
    "langchain-core>=1.0",

    # MCP
    "fastmcp>=4.0",

    # Local AI: STT
    "faster-whisper>=1.0",

    # Local AI: TTS
    "pyttsx3>=2.90",

    # Local AI: Translation
    "argostranslate>=1.9",

    # Local AI: Embeddings + Vector store
    "sentence-transformers>=3.0",
    "chromadb>=1.0",

    # PDF processing
    "PyMuPDF>=1.24",
    "Pillow>=10.0",

    # Presentations
    "python-pptx>=1.0",

    # Media
    "yt-dlp>=2024.0",

    # Code validation
    "esprima>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "core*", "mcp_server*", "models*", "routes*", "services*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
