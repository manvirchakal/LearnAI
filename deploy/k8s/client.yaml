apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnai-client
  labels: {app.kubernetes.io/name: learnai, app.kubernetes.io/component: client}
spec:
  # Stateless: scale freely
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: learnai, app.kubernetes.io/component: client}
  template:
    metadata:
      labels: {app.kubernetes.io/name: learnai, app.kubernetes.io/component: client}
    spec:
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: client
          image: learnai-client
          ports:
            - {name: http, containerPort: 3000}
          env:
            # Where the Next.js server proxies /api-backend/* (read at runtime)
            - {name: API_URL, value: "http://learnai-server:8000"}
          readinessProbe:
            httpGet: {path: /home, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /home, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: learnai-client
  labels: {app.kubernetes.io/name: learnai, app.kubernetes.io/component: client}
spec:
  selector: {app.kubernetes.io/name: learnai, app.kubernetes.io/component: client}
  ports:
    - {name: http, port: 3000, targetPort: http}
