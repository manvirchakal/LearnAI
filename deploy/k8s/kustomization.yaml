# kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: learnai

resources:
  - namespace.yaml
  - pvc.yaml
  - server.yaml
  - client.yaml
  - ingress.yaml

configMapGenerator:
  - name: learnai-server-config
    envs: [server.env]

# Secrets stay out of git (Argo CD syncs this directory). Create them once:
#   kubectl -n learnai create secret generic learnai-server-secrets --from-env-file=secret.env
#   kubectl -n learnai create secret docker-registry registry-credentials \
#     --docker-server=git.example.lan --docker-username=<user> --docker-password=<token>
# Both are optional: the server runs without the first, and the second is only
# needed while the Forgejo packages are private.

# newTag is pinned to a commit SHA by the Woodpecker deploy-bump step.
images:
  - name: learnai-server
    newName: git.example.lan/OWNER/learnai-server
    newTag: latest
  - name: learnai-client
    newName: git.example.lan/OWNER/learnai-client
    newTag: latest
